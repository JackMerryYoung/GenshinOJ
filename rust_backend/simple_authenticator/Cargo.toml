[package]
name = "simple_authenticator"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.39.2", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.17.0", features = ["v4"] }
ansi_term = "0.12"
bytes = "1.10.1"
mysql_async = "0.36.1"
rand = "0.9.1"
rust-crypto = "0.2.36"
chrono = "0.4.42"

[lib]
crate-type = ["dylib"]
