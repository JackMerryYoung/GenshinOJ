[package]
name = "control_panel"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.39.2", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
ansi_term = "0.12"
chrono = "0.4.42"
axum = { version = "0.8.4", features = ["multipart"] }
mysql_async = "0.36.1"
uuid = { version = "1.17.0", features = ["v4"] }
rust-crypto = "0.2.36"
lazy_static = "1.4"
tower-http = { version = "0.6", features = ["cors"] }

[lib]
crate-type = ["dylib"]
