[package]
name = "ws_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7.5", features = ["ws"] }
tokio = { version = "1.39.2", features = ["full"] }
tracing = "0.1.37"
futures-core = "0.3.31"
futures-sink = "0.3.31"
bytes = "1.10.1"
futures-util = "0.3.31"
dlopen2 = "0.7.0"
retry = "2.1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[lib]
crate-type = ["dylib"]
