[package]
name = "chat_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
tokio = { version = "1.39.2", features = ["full"] }
dlopen2 = "0.8.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.17.0", features = ["v4"] }
bytes = "1.10.1"

[lib]
crate-type = ["dylib"]
