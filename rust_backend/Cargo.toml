cargo-features = ["profile-rustflags", "codegen-backend"]


[workspace]
members = [
    "main_backend",
    "ws_server",
    "chat_server",
    "db_connector",
    "simple_authenticator",
    "judge",
    "userish",
]
resolver = "2"

[profile.dev]
opt-level = 0
rustflags = ["-Zthreads=8"]
codegen-backend = "cranelift"
[profile.dev.package."*"]
opt-level = 0
rustflags = ["-Zthreads=8"]

[profile.release]
lto = true
rustflags = ["-Zthreads=8"]
