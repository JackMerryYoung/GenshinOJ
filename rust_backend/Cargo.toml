cargo-features = ["profile-rustflags"]

[workspace]
members = [
    "main_backend",
    "ws_server",
    "chat_server",
    "db_connector",
    "simple_authenticator",
]
resolver = "2"

[profile.dev]
opt-level = 0
rustflags = ["-Zthreads=8"]
[profile.dev.package."*"]
opt-level = 0
rustflags = ["-Zthreads=8"]

[profile.release]
lto = true
rustflags = ["-Zthreads=8"]
